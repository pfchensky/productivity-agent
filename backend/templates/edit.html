<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
</head>
<body>
    <h1>Edit Task</h1>

    <form action="{{ url_for('update_task', task_id=task.task_id) }}"
          method="POST">

        <label for="name">Task name:</label>
        <input id="name" type="text" name="user_input"
               value="{{ task.name }}" required>
        <br>

        <label for="deadline">Deadline:</label>
        <input id="deadline" type="date" name="deadline"
               value="{{ task.deadline }}" required>
        <br>

        <label for="importance">Importance:</label>
        <select id="importance" name="importance">
            {% for level in ['Low', 'Medium', 'High'] %}
                <option value="{{ level }}"
                        {% if task.importance == level %}selected{% endif %}>
                    {{ level }}
                </option>
            {% endfor %}
        </select>
        <br>

        <label for="progress">Progress (%):</label>
        <input id="progress" type="number" name="progress"
               value="{{ task.progress }}"
               min="0" max="100" step="1" required>
        <br>

        <label for="status">Status:</label>
        <select id="status" name="status">
            {% for status in ['Not Started', 'In Progress', 'Completed'] %}
                <option value="{{ status }}"
                        {% if task.status == status %}selected{% endif %}>
                    {{ status }}
                </option>
            {% endfor %}
        </select>
        <br>

        <button type="submit">Save changes</button>
        <a href="{{ url_for('home') }}">Cancel</a>
    </form>
</body>
</html>
